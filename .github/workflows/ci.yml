name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: opengrid

      - name: Linux GUI system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0

      - name: Lint
        run: |
          ruff check .
          ruff format --check .
          clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.hpp' '*.h')
          python tools/check_no_ternary.py

      - name: C++ build and tests
        run: |
          cmake --preset ci
          cmake --build --preset ci
          ctest --preset ci

      - name: Python package
        run: pip install --no-build-isolation -v .

      - name: Python tests (macOS)
        if: runner.os == 'macOS'
        run: pytest -q

      - name: Python tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest -q
