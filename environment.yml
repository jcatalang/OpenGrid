# Primary development environment for OpenGrid (conda-forge only).
#   conda env create -f environment.yml
#   conda activate opengrid
name: opengrid
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  # build
  - cmake>=3.28
  - ninja
  - nanobind>=2.0
  - scikit-build-core>=0.10
  - pip
  # C/C++ libraries
  - gtest
  - eigen
  - hdf5
  - cgns
  - zlib  # development link needed by the CGNS CMake config
  # GUI / visualization
  - pyside6>=6.6
  - vtk>=9.3
  - pyvista>=0.43
  - pyvistaqt>=0.11
  - qtpy
  # numerics / I/O
  - numpy>=1.26
  - meshio>=5.3
  - h5py
  # test / lint
  - pytest
  - pytest-qt
  - ruff
  - clang-format
  - clang-tools
