# Build variants for packaging/conda/recipe.yaml (rattler-build picks this file up
# automatically next to the recipe). Python 3.12: the run-time dependencies (Netgen, VTK,
# PySide6, OCCT) are all built for it on conda-forge.
python:
  - "3.12"
# Linux: glibc 2.28 as the oldest the package runs on (openSUSE Leap 15.3, SLES 15 SP3, RHEL 8
# and later; conda-forge's own baseline). Used through stdlib('c') in the recipe (Linux only).
c_stdlib:
  - sysroot
c_stdlib_version:
  - "2.28"
# The compilers and the host packages OpenGrid is compiled against, pinned like the locked
# runtime environments (packaging/locks, the packages Release v0.0.2 shipped): a rebuild gets
# the same ones, and the package's run exports (OCCT, CGNS, the C++ runtime) are met by the
# lock. Change them together with the locks (OG_RELOCK=1; packaging/lock_env.py check fails
# the build when they no longer fit).
cxx_compiler_version:
  - if: linux
    then: "16"
  - if: osx
    then: "23"
nanobind:
  - "3.1.0"
scikit-build-core:
  - "1.1.1"
eigen:
  - "5.0.1"
occt:
  - "8.0.1"
cgns:
  - "4.5.2"
hdf5:
  - "2.2.0"
llvm-openmp:
  - "23.1.4"
